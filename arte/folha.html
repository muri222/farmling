<!doctype html>
<meta charset="utf-8">
<title>Vidinha - folha de arte</title>
<style>
  body { margin: 0; background: #1b1d1a; color: #cfd6c0; font: 12px Consolas, monospace; }
  #f { display: block; }
</style>
<canvas id="f" width="980" height="600"></canvas>
<script src="sprites.js"></script>
<script>
const cv = document.getElementById('f'), x = cv.getContext('2d');
x.imageSmoothingEnabled = false;
const S = (c, px, py, k = 1, flip = false) => { // desenha sprite ampliado k vezes
  x.save(); if (flip) { x.translate(px + c.width * k, py); x.scale(-1, 1); x.drawImage(c, 0, 0, c.width * k, c.height * k); } else x.drawImage(c, px, py, c.width * k, c.height * k); x.restore();
};
const nome = (t, px, py) => { x.fillStyle = '#8f9a80'; x.font = 'bold 12px Consolas'; x.fillText(t, px, py); };
x.fillStyle = '#242722'; x.fillRect(0, 0, 980, 330);

// ---- sprites individuais ----
const K = 5;
let px = 14;
nome('fazendeiro', px, 18);
[0, 1, 2].forEach((f, i) => S(Arte.fazendeiro(f), px + i * 90, 28, K)); px += 280;
nome('fazendeiro velho', px, 18); S(Arte.fazendeiro(0, { barba: 1, cabelo: '#cfcfcf' }), px, 28, K); px += 100;
nome('esposa', px, 18); S(Arte.mulher(0), px, 28, K); px += 100;
nome('filhos', px, 18); S(Arte.crianca('#d96a3a'), px, 28 + 5 * 8, K); S(Arte.crianca('#3aa8d9', 1), px + 62, 28 + 5 * 8, K); px += 140;
nome('crescimento', px, 18); [0, 1, 2, 3].forEach(i => S(Arte.planta(i), px + i * 52, 28 + 5 * 12, K - 1));
px = 14;
nome('galinha', px, 190); S(Arte.galinha(false), px, 200, K); S(Arte.galinha(true), px + 90, 200, K);
nome('cachorro', 200, 190); S(Arte.cachorro(0), 200, 215, K); S(Arte.cachorro(2), 300, 215, K);
nome('vaca', 410, 190); S(Arte.vaca(), 410, 200, 4);
nome('arvore', 560, 190); S(Arte.arvore(), 560, 130, 3);
nome('celeiro', 680, 190); S(Arte.celeiro(), 680, 150, 3);
nome('casinha', 850, 190); S(Arte.casinha(), 850, 200, 3);

// ---- cena montada na resolucao real do app (144x108), mostrada em 3 paletas ----
const W = 144, A = 108, esc = document.createElement('canvas'); esc.width = W; esc.height = A;
const g = esc.getContext('2d', { willReadFrequently: true });
const r = (a, b, w, h, c) => { g.fillStyle = c; g.fillRect(a, b, w, h); };
const dsc = (cx, cy, rr, c) => { for (let dy = -rr; dy <= rr; dy++) { const w = Math.floor(Math.sqrt(rr * rr - dy * dy) + .5); r(cx - w, cy + dy, 2 * w + 1, 1, c); } };
const sp = (c, a, b, flip) => { g.save(); if (flip) { g.translate(a + c.width, b); g.scale(-1, 1); g.drawImage(c, 0, 0); } else g.drawImage(c, a, b); g.restore(); };
function cena() {
  ['#3f8fe0', '#58a4ea', '#72b8f0', '#8fcaf4', '#aedaf8', '#cbe8fa'].forEach((c, i) => r(0, i * 10, W, 11, c));
  dsc(112, 12, 9, 'rgba(255,230,120,.25)'); dsc(112, 12, 4, '#ffe04a');
  [[18, 12], [70, 8], [100, 24]].forEach(([a, b]) => { dsc(a, b, 3, '#fff'); dsc(a + 6, b - 1, 4, '#fff'); dsc(a + 12, b, 3, '#fff'); r(a - 2, b + 1, 16, 2, '#fff'); r(a - 3, b + 3, 20, 2, '#dbe8f6'); });
  for (let i = 0; i < W; i++) { const h1 = 46 - 6 * Math.sin(i / 19) - 3 * Math.sin(i / 7 + 2), h2 = 54 - 4 * Math.sin(i / 11 + 1) - 2 * Math.sin(i / 5); r(i, h1, 1, 60 - h1, '#7fb0b8'); r(i, h2, 1, 60 - h2, '#5a9a6a'); }
  r(0, 60, W, A - 60, '#5aa832'); r(0, 60, W, 2, '#7bc84a'); r(0, 62, W, 1, '#4a9028');
  for (let i = 0; i < 40; i++) { const a = (Math.sin(i * 12.9) * 43758 % 1 + 1) % 1 * W, b = 64 + (Math.sin(i * 78.2) * 24634 % 1 + 1) % 1 * 40; r(a, b, 1, 2, '#3f8a24'); }
  sp(Arte.arvore(), 2, 26); sp(Arte.celeiro(), 94, 18);
  for (let i = 22; i < 92; i += 9) { r(i, 59, 2, 9, '#b08850'); r(i, 59, 1, 9, '#d4b078'); } r(22, 61, 70, 1, '#c9a56a'); r(22, 65, 70, 1, '#c9a56a');
  for (let l = 0; l < 3; l++) { const y = 72 + l * 11; r(24, y + 10, 118, 2, '#5e3818'); r(24, y + 9, 118, 1, '#7a4a24'); for (let c = 0; c < 12; c++) sp(Arte.planta(Math.min(3, (c + l) % 4)), 26 + c * 9.5 | 0, y - 3); }
  sp(Arte.galinha(false), 3, 78); sp(Arte.galinha(true), 3, 92, true); sp(Arte.vaca(), 0, 62 + 5);
  sp(Arte.cachorro(1), 60, 52);
  sp(Arte.fazendeiro(1), 40, 66); sp(Arte.mulher(0), 62, 70); sp(Arte.crianca('#d96a3a'), 80, 84);
}
cena();
const PAL = {
  colorido: null,
  verde: ['#050d08', '#0f2e17', '#1f5c22', '#3f9a2c', '#7fd23c', '#c8ff7a'],
  ambar: ['#100700', '#321a00', '#6e3c00', '#b36a00', '#ee9d1a', '#ffd77a'] };
const CORTE = [25, 60, 95, 130, 170];
function tinge(nm) {
  const out = document.createElement('canvas'); out.width = W; out.height = A; const o = out.getContext('2d');
  o.drawImage(esc, 0, 0);
  const pal = PAL[nm]?.map(h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)));
  if (pal) {
    const im = o.getImageData(0, 0, W, A), d = im.data;
    for (let i = 0; i < d.length; i += 4) { const l = .3 * d[i] + .59 * d[i + 1] + .11 * d[i + 2], k = CORTE.findIndex(c => l < c), c = pal[k < 0 ? 5 : k]; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; }
    o.putImageData(im, 0, 0);
  }
  return out;
}
nome('cena roca (144x108, tamanho real do app x2) - colorido / verde / ambar', 14, 350);
['colorido', 'verde', 'ambar'].forEach((nm, i) => x.drawImage(tinge(nm), 10 + i * 300, 360, 288, 216));
</script>
