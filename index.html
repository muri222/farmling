<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Farmling</title>
<style>
  * { box-sizing: border-box; margin: 0; user-select: none; }
  body { background: transparent; overflow: hidden; font: 10px/12px Consolas, monospace; }
  /* sem carcaca: so a tela arredondada, com barra de status no topo */
  #tv { width: 300px; height: 372px; padding: 6px; position: relative; }
  #tv { --fg: #6f6; --bg: #000; }
  #tela { position: relative; width: 288px; height: 216px; background: var(--bg); overflow: hidden;
    border-radius: 26px / 22px; box-shadow: 0 0 0 3px #0c0d0a, 0 4px 14px rgba(0,0,0,.5); cursor: pointer; }
  #tv[data-cor=verde] { --fg: #b4f05a; --bg: #06100a; }
  #tv[data-cor=ambar] { --fg: #ffc24a; --bg: #120900; }
  #tv[data-cor=original] { --fg: #fff1c9; --bg: #2a1a10; }
  #img { position: absolute; inset: 0; }
  canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #tela.crt { border-radius: 42px / 36px; }
  #tela.crt canvas { filter: contrast(1.18) saturate(1.25) brightness(1.08) blur(.55px) drop-shadow(0 0 4px var(--fg)); }
  #tela.crt #img::before { content: ''; position: absolute; inset: 0; pointer-events: none; animation: flick .09s infinite alternate;
    background: linear-gradient(135deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 26%),
      repeating-linear-gradient(90deg, rgba(255,0,0,.08) 0 1px, rgba(0,255,0,.08) 1px 2px, rgba(0,0,255,.08) 2px 3px),
      radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.88) 100%);
    box-shadow: inset 0 0 36px 10px rgba(0,0,0,.92); }
  @keyframes flick { from { opacity: .8 } to { opacity: 1 } }
  #osd { position: absolute; top: 12px; right: 44px; color: var(--fg); font-weight: bold; text-shadow: 0 0 4px var(--fg); }
  #diario { position: absolute; inset: 14px 20px 14px; color: var(--fg); font-size: 9px; line-height: 11px; white-space: pre-wrap; overflow: hidden; }
  #eng { position: absolute; top: 8px; right: 10px; z-index: 2; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 12px; background: rgba(0,0,0,.62);
    color: var(--fg); font-size: 16px; line-height: 24px; cursor: pointer; }
  #eng:hover, #eng:focus-visible { background: var(--fg); color: var(--bg); outline: none; }
  #hud { margin-top: 6px; padding: 4px 10px; height: 52px; border-radius: 10px; background: rgba(8,10,8,.94); color: var(--fg); font: bold 11px/14px Consolas, monospace;
    box-shadow: inset 0 0 0 2px var(--fg), 0 2px 8px rgba(0,0,0,.5); white-space: nowrap; overflow: hidden; }
  #hud b { color: #fff; } #hud i { font-style: normal; opacity: .55; }
  #legenda { margin-top: 6px; height: 50px; padding: 6px 10px; overflow: hidden; border-radius: 10px; color: var(--fg); font-weight: bold;
    font-size: 11px; line-height: 14px; background: rgba(8,10,8,.92); box-shadow: inset 0 0 0 2px var(--fg), 0 2px 8px rgba(0,0,0,.5); }
  #legenda.narr { font-style: italic; opacity: .85; }
  #ctl { margin-top: 6px; height: 24px; display: flex; align-items: center; justify-content: center; gap: 3px; border-radius: 12px;
    background: rgba(18,20,16,.94); color: #cfd6c0; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  #ctl button { height: 18px; min-width: 18px; padding: 0 5px; border: 0; border-radius: 9px; background: #343a2e; color: inherit; font: inherit; cursor: pointer; }
  #ctl button:hover { background: #4d5642; }
  #ctl button.on { background: #b4f05a; color: #101808; }
  #ctl span { min-width: 38px; text-align: center; }
  #ctl i { width: 1px; height: 12px; background: #4a5040; margin: 0 3px; }
  #tela { cursor: pointer; }
  #zoom { position: absolute; left: 10px; bottom: 9px; display: flex; gap: 3px; z-index: 1; }
  #zoom button { width: 20px; height: 18px; padding: 0; border: 0; border-radius: 9px; background: rgba(0,0,0,.6); color: var(--fg); font: bold 12px/18px Consolas, monospace; cursor: pointer; }
  #vel { position: absolute; right: 10px; bottom: 9px; display: flex; gap: 3px; z-index: 1; }
  #vel button { height: 18px; padding: 0 5px; border: 0; border-radius: 9px; background: rgba(0,0,0,.6); color: var(--fg); font: bold 11px/18px Consolas, monospace; cursor: pointer; }
  #vel button:hover { background: var(--fg); color: var(--bg); }
  #vel button.on { background: var(--fg); color: var(--bg); }
  #zoom button.on { background: var(--fg); color: var(--bg); }
  #zoom button:hover { background: var(--fg); color: var(--bg); }
  #fechar, #expandir { position: absolute; top: 8px; z-index: 2; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 12px; background: rgba(0,0,0,.62); color: var(--fg); font: bold 13px/24px Consolas, monospace; cursor: pointer; }
  #fechar { right: 38px; } #expandir { left: 10px; }
  #fechar:hover, #expandir:hover { background: var(--fg); color: var(--bg); }
  #chat { position: absolute; inset: 6px; z-index: 6; padding: 8px 10px; border-radius: 18px; background: rgba(8,10,8,.98); color: var(--fg); display: flex; flex-direction: column;
    box-shadow: inset 0 0 0 2px var(--fg); font: bold 11px/14px Consolas, monospace; }
  #chat button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  #chatlog { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--fg) transparent; display: flex; flex-direction: column; gap: 6px; padding: 4px 2px; }
  .msg { max-width: 86%; padding: 5px 8px; border-radius: 10px; font-weight: normal; font-size: 12px; line-height: 15px; overflow-wrap: anywhere; }
  .msg.f { align-self: flex-start; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); } .msg.f b { display: block; font-size: 10px; }
  .msg.u { align-self: flex-end; background: var(--fg); color: var(--bg); }
  #chatf { display: flex; gap: 6px; margin-top: 6px; }
  #chatf input { flex: 1; min-width: 0; padding: 6px 8px; border: 0; border-radius: 8px; background: rgba(255,255,255,.1); color: #fff; font: 12px Consolas, monospace; box-shadow: inset 0 0 1px 1px var(--fg); outline: none; }
  #chatf button { padding: 6px 10px; border-radius: 8px; background: var(--fg); color: var(--bg); font-size: 11px; }
  #chat .av { color: #fd8; font-weight: normal; margin: 4px 0 0; }
  #diario { pointer-events: auto; cursor: pointer; } #legenda { cursor: pointer; } #tv.arrasta * { cursor: grabbing !important; }
  [hidden] { display: none !important; }
  #menu, #pop, #iaw { scrollbar-width: thin; scrollbar-color: var(--fg) transparent; }
  #menu, #pop, #iaw { position: absolute; inset: 6px; z-index: 6; overflow-y: auto; padding: 8px 10px; border-radius: 18px; background: rgba(8,10,8,.98); color: var(--fg);
    box-shadow: inset 0 0 0 2px var(--fg); font: bold 11px/14px Consolas, monospace; }
  #menu button, #pop button, #iaw button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .mh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; letter-spacing: 1px; }
  .mh button { padding: 3px 8px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--fg); }
  .row { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 2px 6px; min-height: 21px; border-radius: 6px; text-align: left; }
  .row:hover, .mh button:hover, .mf button:hover { background: var(--fg); color: var(--bg); }
  .sl input { width: 110px; accent-color: var(--fg); }
  .mf { display: flex; gap: 8px; margin-top: 6px; } .mf button { flex: 1; padding: 5px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--fg); }
  #menu .perigo { color: #f88; }
  .hi { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.1); } .hi i { display: block; font-style: normal; opacity: .55; font-size: 10px; } .hi b { color: #fff; }
  #pop pre { white-space: pre-wrap; font: inherit; font-size: 12px; line-height: 16px; margin: 0; }
  #iaw p { margin: 6px 0; font-weight: normal; } #iaw .av { color: #fd8; } #iaw .hw { opacity: .8; }
  .card { display: block; width: 100%; text-align: left; padding: 6px 8px; margin: 4px 0; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
  .card.on { box-shadow: inset 0 0 0 2px var(--fg); } .card span { font-weight: normal; opacity: .85; }
  .card em { font-style: normal; font-size: 10px; padding: 1px 5px; border-radius: 6px; background: var(--fg); color: var(--bg); }
  #iaw .mf { position: sticky; bottom: -6px; padding: 6px 0 2px; background: rgba(8,10,8,.98); }
  .bar { height: 10px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--fg); margin: 8px 0 4px; } .bar i { display: block; height: 100%; background: var(--fg); border-radius: 5px; }
</style>

<div id="tv" data-cor="verde">
  <div id="tela" title="Clique pra puxar conversa">
    <div id="img">
      <canvas id="cv" width="288" height="216"></canvas>
      <div id="diario" hidden></div>
      <div id="osd"></div>
    </div>
    <button id="eng" aria-label="Configurações" title="Configurações">⚙</button>
    <button id="fechar" title="Minimizar para a bandeja">✕</button>
    <button id="expandir" title="Expandir" hidden>⤢</button>
    <div id="vel"></div>
    <div id="zoom"><button id="z-m" title="Afastar (roda do mouse)">−</button><button id="z-c" title="Seguir o fazendeiro (cena e camera)">⌖</button><button id="z-p" title="Aproximar (roda do mouse)">+</button><button id="z-h" title="Histórico">≡</button><button id="z-chat" title="Conversar">💬</button></div>
  </div>
  <div id="hud"><div id="h1"></div><div id="h2"></div><div id="h3"></div></div>
  <div id="ctl">
    <button id="c-prev" title="Canal anterior">◀</button><span id="c-ch"></span><button id="c-next" title="Próximo canal">▶</button><i></i>
    <button id="c-vm" title="Volume -">−</button><span id="c-vol"></span><button id="c-vp" title="Volume +">+</button><i></i>
    <button id="c-crt" title="Efeito CRT">CRT</button><button id="c-cor" title="Trocar cor"></button>
  </div>
  <div id="legenda" aria-live="polite" title="Histórico"></div>
  <div id="menu" hidden></div><div id="pop" hidden></div><div id="iaw" hidden></div><div id="chat" hidden></div>
</div>


<script src="arte/sprites.js"></script>
<script src="i18n.js"></script>
<script src="sim.js"></script>
<script>
const MES_MS = 20000;  // 1 mes da vida dele = 20 s reais (1 ano = 4 min, uma vida = umas 3 a 5 horas)
const DIA_MS = 120000; // dia e noite na tela
const $ = id => document.getElementById(id);

// ---------- estado ----------
let cfg = { canal: 0, vol: 2, crt: true, cor: 'verde', zoom: 2, seguir: true, vel: 1, lang: 'pt', volFx: 5, volTxt: 3, voz: 'suave', tam: 1 }, s;
try { Object.assign(cfg, JSON.parse(localStorage.cfg)); s = JSON.parse(localStorage.vidinha); } catch {}
s ||= Sim.novo(Date.now());
Sim.migra(s);
const VELS = [0, 1, 3, 10, 30]; // velocidades do tempo (0 = pausa)
if (!VELS.includes(cfg.vel)) cfg.vel = 1;
if (!I18N.UI[cfg.lang]) cfg.lang = 'pt';
I18N.set(cfg.lang); Sim.setLang(cfg.lang);
const T = I18N.t, esc = x => String(x).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
let tv = Date.now(), acc = 0, ultR = performance.now(); // tv = relogio do mundo (anda mais rapido ou mais devagar que o real)
// a vida continuou enquanto o app estava fechado (no maximo 600 meses por vez)
for (let n = Math.min(600, (Date.now() - (+localStorage.ultimo || Date.now())) / MES_MS | 0); n > 0; n--) Sim.step(s);
const salvar = () => { localStorage.vidinha = JSON.stringify(s); localStorage.cfg = JSON.stringify(cfg); localStorage.ultimo = Date.now(); };

// ---------- som: notas suaves (seno/triangulo com envelope e filtro) no lugar do bip quadrado ----------
let ac;
const MESTRE = [0, .45, .75, 1], VOL = MESTRE; // volume geral (botoes da barra); efeitos e voz do texto tem controle proprio nas configuracoes
const gFx = () => MESTRE[cfg.vol] * cfg.volFx / 10, gTxt = () => MESTRE[cfg.vol] * cfg.volTxt / 10;
function nota(f, d, g, tipo = 'sine', quando = 0) {
  if (g <= 0) return;
  ac ??= new AudioContext();
  const o = ac.createOscillator(), a = ac.createGain(), fl = ac.createBiquadFilter(), t0 = ac.currentTime + quando;
  o.type = tipo; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = 2400;
  a.gain.setValueAtTime(.0001, t0); a.gain.exponentialRampToValueAtTime(Math.max(.0002, g * .3), t0 + .012); a.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(fl).connect(a).connect(ac.destination); o.start(t0); o.stop(t0 + d + .03);
}
function ruido(d, g, freq) {
  if (g <= 0) return;
  ac ??= new AudioContext();
  const b = ac.createBuffer(1, Math.floor(ac.sampleRate * d), ac.sampleRate), x = b.getChannelData(0), n = ac.createBufferSource(), a = ac.createGain(), fl = ac.createBiquadFilter();
  for (let i = 0; i < x.length; i++) x[i] = Math.random() * 2 - 1;
  fl.type = 'lowpass'; fl.frequency.value = freq; a.gain.setValueAtTime(g * .25, ac.currentTime); a.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
  n.buffer = b; n.connect(fl).connect(a).connect(ac.destination); n.start();
}
const bip = (f, d = .06, quando = 0) => nota(f, Math.max(d, .1), gFx(), 'sine', quando);
const toca = notas => notas.forEach((f, i) => nota(f, .4, gFx(), 'triangle', i * .12));
const SONS = { amor: [523, 659, 784], filho: [523, 587, 659, 784], morte: [392, 330, 262, 196], nasce: [262, 392, 523],
  ruim: [220, 196], bom: [440, 554], gente: [440, 494], estranho: [330, 392, 330, 494] };
function clique(voz) { // som de cada letra que ele "fala": tres estilos suaves
  const g = gTxt(); if (g <= 0 || cfg.voz === 'mudo') return;
  if (cfg.voz === 'teclado') ruido(.018, g * .7, 2600);
  else if (cfg.voz === 'bichinho') nota(voz * 1.7 + Math.random() * 140, .07, g, 'triangle');
  else nota(voz * .9 + Math.random() * 50, .05, g, 'sine');
}
const chiado = () => ruido(.16, gFx() * .5, 1800);

// ---------- legenda (fala dele e acontecimentos) ----------
const fila = [];
let falando = false, digitando = false;
function dizer(txt, quem) { // quem vazio = acontecimento narrado
  s.hist.push({ a: Math.floor(s.vida.idade), e: Sim.est(s), q: quem || '', x: txt }); if (s.hist.length > 100) s.hist.shift();
  if (fila.length > 3) fila.shift();
  fila.push([txt, quem]);
  if (!digitando) proxima();
}
function proxima() {
  const it = fila.shift();
  if (!it) { digitando = false; $('legenda').textContent = ''; return; }
  digitando = true;
  const quem = it[1], txt = I18N.tr(it[0]), el = $('legenda'), voz = 300 - s.vida.idade * 1.5;
  el.className = quem ? '' : 'narr';
  el.style.fontSize = txt.length > 115 ? '9px' : txt.length > 75 ? '10px' : '11px'; // texto longo: letra menor pra caber (o historico guarda tudo)
  falando = !!quem;
  let i = 0;
  const id = setInterval(() => {
    el.textContent = (quem ? quem + ': ' : '★ ') + txt.slice(0, ++i);
    if (quem && i % 2 && txt[i - 1] !== ' ') clique(voz);
    if (i >= txt.length) { clearInterval(id); falando = false; setTimeout(proxima, fila.length ? 2500 : 7000); }
  }, 35);
}

// ---------- mente ----------
let iaAtiva = false; // vira true quando ha um modelo de IA escolhido (janela do cerebro)
let pensando = false, iaFila = Promise.resolve(), iaPend = 0;
function pedeIA(p, forca) { // um pedido por vez pro modelo; se ja ha 3 na fila, descarta (nao trava o app); o chat (forca) nunca e descartado
  if (!iaAtiva || !window.ia || (iaPend >= 3 && !forca)) return Promise.resolve(null);
  iaPend++;
  const r = iaFila.then(() => window.ia(p)).catch(() => null);
  iaFila = r; r.finally(() => iaPend--);
  return r;
}
const tira = txt => String(txt || '').replace(/<think>[\s\S]*?<\/think>/g, '');
async function pensar() {
  if (pensando) return;
  pensando = true;
  const v = s.vida, vis = s.visitante;
  let quem = v.nome, txt;
  if (vis && Math.random() < .3) { // o visitante tambem fala
    quem = vis.nome;
    txt = Sim.limpa(tira(await pedeIA({ max: 60, sistema: `Você é ${vis.nome}, ${vis.papel}, visitando a roça de ${v.nome}. ${vis.segredo ? 'Seu segredo: ' + vis.segredo + '. ' : ''}Responda ${Sim.lt()} com UMA fala curta (até 120 caracteres), sem aspas, sem emoji.`, pedido: 'Diga algo ao fazendeiro.' })), 160) || vis.fala || `Que lugar bonito, ${v.nome}.`;
  } else {
    txt = Sim.limpa(tira(await pedeIA(Sim.prompt(s))), 160) || Sim.falaPronta(s);
    if (v === s.vida) { v.falas.push(txt); if (v.falas.length > 3) v.falas.shift(); }
  }
  if (v === s.vida) dizer(txt, quem); // nao fala depois de morto
  pensando = false;
}
(function agenda() {
  const k = cfg.vel > 1 ? Math.min(cfg.vel, 4) : 1;
  setTimeout(() => { if (cfg.vel > 0) pensar(); agenda(); }, Math.max(15000, (60000 + Math.random() * 90000) / k));
})();
setTimeout(pensar, 4000);

// a IA inventa o que o sorteio so esboca: perfil de cada vida, licoes, o texto do evento estranho e quem e o visitante
async function enriquecePerfil(v) {
  const c = Sim.leCampos(await pedeIA(Sim.pedidoPerfil(v)), ['sonho', 'medo', 'mania', 'passado']);
  if (Object.keys(c).length) Object.assign(v.perfil, c, { ia: true });
}
async function refletir(v) {
  const r = Sim.limpa(tira(await pedeIA(Sim.pedidoLicao(s, v))), 110);
  if (r && v === s.vida) { v.licoes.push(r); if (v.licoes.length > 4) v.licoes.shift(); dizer(r, v.nome); }
}
async function inventaEvento() {
  const ev = s.evento, r = ev && Sim.limpa(tira(await pedeIA(Sim.pedidoEvento(s, ev.cena))), 110);
  if (r && s.evento === ev) { ev.txt = r; dizer(r); }
}
async function criaVisitante(vis) {
  const c = Sim.leCampos(await pedeIA(Sim.pedidoVisitante(vis)), ['segredo', 'fala']);
  if (s.visitante === vis) { Object.assign(vis, c); if (c.fala) dizer(c.fala, vis.nome); }
}

let ultAno = Math.floor(s.vida.idade);
function passaMes() {
  const v0 = s.vida;
  for (const ev of Sim.step(s)) {
    dizer(ev.txt); interesse(ev);
    if (cfg.vel <= 3) toca(SONS[ev.tipo] || SONS.bom);
    if (ev.tipo === 'nasce') enriquecePerfil(s.vida);
    if (ev.tipo === 'estranho' && cfg.vel <= 3) inventaEvento();
    if (ev.visitante && cfg.vel <= 3) criaVisitante(s.visitante);
  }
  const ano = Math.floor(s.vida.idade);
  if (ano !== ultAno) { ultAno = ano; if (s.vida === v0 && ano % 2 === 0 && cfg.vel <= 10) refletir(s.vida); }
  salvar();
}

// ---------- desenho ----------
// O mundo de cada cena tem 288x216 unidades; a tela (canvas 288x216) mostra VW/z x VH/z delas. z = 1, 2 ou 3 (inteiro: pixel nitido).
const g = $('cv').getContext('2d', { willReadFrequently: true }), VW = 288, VH = 216, W = 288, A = 216;
let t = 0, estatica = 0;
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const disco = (cx, cy, r, c) => { for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy) + .5); R(cx - w, cy + dy, 2 * w + 1, 1, c); } };
const elip = (cx, cy, rx, ry, c) => { for (let dy = -ry; dy <= ry; dy++) { const w = Math.floor(rx * Math.sqrt(1 - (dy / ry) ** 2) + .5); R(cx - w, cy + dy, 2 * w + 1, 1, c); } };
const rn = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }; // ruido fixo pros enfeites
const cor = n => `hsl(${[...n].reduce((a, c) => a + c.charCodeAt(0) * 37, 0) % 360} 55% 50%)`;
const dia = () => (tv / DIA_MS) % 1;
const noite = () => dia() > 0.6;
// onde ele esta agora: de noite em casa; de dia na roça, e a cada 3 dias vai pra vila
// de manha cedo e a noite em casa; no resto do dia trabalha na roça (e a cada 3 dias passa o dia na vila)
const lugar = () => { const d = dia(); return d < .1 || d >= .6 ? 'casa' : (tv / DIA_MS | 0) % 3 === 2 ? 'vila' : 'roça'; };
const zzz = (x, y) => { R(x, y, 3, 1, '#fff'); R(x + 1, y + 1, 1, 1, '#fff'); R(x, y + 2, 3, 1, '#fff'); };

// ---------- camera ----------
const ZOOMS = [1, 2, 3];
const cam = { x: 0, y: 0, z: ZOOMS.includes(cfg.zoom) ? cfg.zoom : 2, foco: [W / 2, A / 2], centrar: true, int: null };
const limita = () => { cam.x = Math.max(0, Math.min(W - VW / cam.z, cam.x)); cam.y = Math.max(0, Math.min(A - VH / cam.z, cam.y)); };
const setFoco = (x, y) => { cam.foco = [x, y]; };
function segue() { // a camera sempre acompanha o foco com suavidade

$('fechar').onclick = () => window.app ? app.esconder() : close();

// ---------- chat: conversar com o fazendeiro ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));
let chatFila = [], chatRodando = false, chatSeq = 0, chunkCb = null;
if (window.app) app.aoChunk(d => chunkCb?.(d));
function atualizaLog() {
  const el = $('chatlog'); if (!el) return;
  el.innerHTML = s.chat.map((m, i) => `<div class="msg ${m.q}" data-i="${i}">${m.q === 'f' ? `<b>${esc(s.vida.nome)}</b>` : ''}${esc(m.x)}</div>`).join('') || `<p class="av">${T('chatVazio')}</p>`;
  el.scrollTop = el.scrollHeight;
}
function mostraTexto(m, txt) { // atualiza so a bolha dele (nao recria a lista)
  m.x = txt; const el = $('chatlog')?.querySelector(`[data-i="${s.chat.indexOf(m)}"]`);
  if (el) { el.lastChild.textContent = txt; $('chatlog').scrollTop = $('chatlog').scrollHeight; }
}
function abreChat() {
  $('menu').hidden = true; $('pop').hidden = true;
  $('chat').innerHTML = `<div class="mh"><b>${T('chatTitulo')} · ${esc(s.vida.nome)}</b><button data-a="voltar">← ${T('voltar')}</button></div><div id="chatlog"></div>` +
    (iaAtiva ? '' : `<p class="av">${T('chatSemIa')}</p>`) +
    `<form id="chatf"><input id="chat-in" maxlength="200" placeholder="${T('chatDigite')}" autocomplete="off"><button type="submit">${T('chatEnviar')}</button></form>`;
  $('chat').hidden = false; atualizaLog(); $('chat-in').focus();
}
async function conversa(it) {
  const v = s.vida, m = { q: 'f', x: '…' };
  s.chat.push(m); atualizaLog();
  const id = ++chatSeq; let acum = '', n = 0;
  chunkCb = d => { // a resposta aparece enquanto a IA escreve
    if (d.id !== id) return;
    acum += d.t; mostraTexto(m, acum.replace(/\s+/g, ' ').trimStart() || '…');
    if (++n % 2 === 0 && /\S/.test(d.t)) clique(300 - v.idade * 1.5);
  };
  const p = Sim.promptChat(s, it.txt, it.hist); p.id = id;
  const r = iaAtiva && window.app ? await app.chat(p).catch(() => null) : null;
  chunkCb = null;
  let txt = r && Sim.limpa(tira(r.texto), 280);
  if (txt) { const k = Math.max(txt.lastIndexOf('.'), txt.lastIndexOf('!'), txt.lastIndexOf('?')); if (k > 30 && k < txt.length - 1) txt = txt.slice(0, k + 1); } // corta na ultima frase completa
  else { // sem IA (ou falhou): fala pronta, digitada
    txt = I18N.tr(Sim.respostaPronta(s, it.txt));
    for (let i = 1; i <= txt.length; i++) { mostraTexto(m, txt.slice(0, i)); if (i % 2 && txt[i - 1] !== ' ') clique(300 - v.idade * 1.5); await sleep(22); }
  }
  mostraTexto(m, txt);
  if (s.chat.length > 40) s.chat.splice(0, s.chat.length - 40);
  s.nChat = (s.nChat || 0) + 1; salvar();
  if (s.nChat % 4 === 0 && iaAtiva) { // de tempos em tempos ele resume o que aprendeu sobre o amigo
    const nota = Sim.limpa(tira(await pedeIA(Sim.pedidoMemoria(s), true)), 120);
    if (nota) { s.memUsuario.push(nota); if (s.memUsuario.length > 5) s.memUsuario.shift(); salvar(); }
  }
}
async function rodaChat() { if (chatRodando) return; chatRodando = true; while (chatFila.length) await conversa(chatFila.shift()); chatRodando = false; }
$('chat').onsubmit = e => { // pode digitar enquanto ele ainda responde: as mensagens entram numa fila
  e.preventDefault(); const i = $('chat-in'), txt = i.value.trim(); if (!txt) return; i.value = '';
  const hist = s.chat.slice(-8); s.chat.push({ q: 'u', x: txt }); s.vida.traits.otimismo = Math.min(1, s.vida.traits.otimismo + .01); atualizaLog();
  chatFila.push({ txt, hist }); rodaChat();
};
$('chat').onclick = e => { if (e.target.closest('[data-a]')) $('chat').hidden = true; };
$('z-chat').onclick = abreChat;

// ---------- popup de texto (historico e diario expandido) ----------
const abrePop = (titulo, corpo) => { $('pop').innerHTML = `<div class="mh"><b>${titulo}</b><button data-a="voltar">← ${T('voltar')}</button></div>${corpo}`; $('pop').hidden = false; $('menu').hidden = true; };
function abreHist() {
  const it = s.hist.slice().reverse().map(x => `<div class="hi"><i>${x.a} ${T('anos')} · ${T('estacoes')[x.e]}</i>${x.q ? '<b>' + esc(x.q) + ':</b> ' : ''}${esc(I18N.tr(x.x))}</div>`).join('');
  abrePop(T('histTitulo'), it || '—');
}
const abreDiario = () => abrePop(T('diarioTitulo'), `<pre>${esc(textoDiario())}</pre>`);
$('pop').onclick = e => { if (e.target.closest('[data-a]')) $('pop').hidden = true; };
$('legenda').onclick = abreHist; $('z-h').onclick = abreHist; $('z-chat').title = T('conversar'); $('expandir').onclick = abreDiario; $('diario').onclick = abreDiario;

// ---------- menu de configuracoes ----------
const onoff = b => T(b ? 'ligado' : 'desligado');
function montaMenu() {
  const m = $('menu'), L = (id, rot, val) => `<button class="row" data-a="${id}"><span>${rot}</span><b>${val}</b></button>`;
  const S2 = (id, rot, v) => `<div class="row sl"><span>${rot}</span><input type="range" min="0" max="10" value="${v}" data-s="${id}"></div>`;
  m.innerHTML = `<div class="mh"><b>${T('config')}</b><button data-a="voltar">← ${T('voltar')}</button></div>` +
    L('lang', T('idioma'), I18N.idiomas[cfg.lang]) + L('tam', T('tam'), T('tams')[cfg.tam]) + L('canal', T('canal'), `◀ ${T('canais')[cfg.canal]} ▶`) +
    L('cor', T('cor'), cfg.cor.toUpperCase()) + L('crt', T('crt'), onoff(cfg.crt)) +
    L('mestre', T('mestre'), cfg.vol ? '▮'.repeat(cfg.vol) : T('mudoVol')) + S2('volFx', T('fx'), cfg.volFx) + S2('volTxt', T('voz'), cfg.volTxt) + L('voz', T('vozEstilo'), T('vozes')[cfg.voz]) +
    L('topo', T('topo'), onoff(janelaEstado.topo)) + L('barra', T('barra'), onoff(janelaEstado.barra)) + L('ia', T('cerebro'), iaAtiva ? T('iaOn') : T('iaOff')) +
    `<div class="mf"><button data-a="esconder">${T('esconder')}</button><button data-a="sair" class="perigo">${T('sair')}</button></div>`;
}
const menu = (abre = $('menu').hidden) => { if (abre) { montaMenu(); $('pop').hidden = true; } $('menu').hidden = !abre; };
$('eng').onclick = () => menu();
$('menu').onclick = e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, langs = Object.keys(I18N.idiomas), vozes = Object.keys(T('vozes'));
  if (a === 'voltar') return menu(false);
  if (a === 'lang') { cfg.lang = langs[(langs.indexOf(cfg.lang) + 1) % langs.length]; I18N.set(cfg.lang); Sim.setLang(cfg.lang); }
  else if (a === 'tam') { cfg.tam = (cfg.tam + 1) % TAMS.length; aplicaTamanho(); }
  else if (a === 'canal') canal(1);
  else if (a === 'cor') trocaCor();
  else if (a === 'crt') crt();
  else if (a === 'mestre') { cfg.vol = (cfg.vol + 1) % VOL.length; bip(660); }
  else if (a === 'voz') { cfg.voz = vozes[(vozes.indexOf(cfg.voz) + 1) % vozes.length]; for (let i = 0; i < 4; i++) setTimeout(() => clique(300), i * 90); }
  else if (a === 'topo') { janelaEstado.topo = !janelaEstado.topo; window.app?.topo(janelaEstado.topo); }
  else if (a === 'barra') { janelaEstado.barra = !janelaEstado.barra; window.app?.barra(janelaEstado.barra); }
  else if (a === 'ia') return abreIA();
  else if (a === 'esconder') { menu(false); return window.app ? app.esconder() : close(); }
  else if (a === 'sair') { salvar(); return window.sair ? window.sair() : close(); }
  aplicar();
};
$('menu').oninput = e => { const k = e.target.dataset.s; if (!k) return; cfg[k] = +e.target.value; salvar(); };
$('menu').onchange = e => { const k = e.target.dataset.s; if (k === 'volFx') toca([523, 659]); else if (k === 'volTxt') for (let i = 0; i < 4; i++) setTimeout(() => clique(300), i * 90); };
addEventListener('keydown', e => { if (e.key === 'Escape') { $('menu').hidden = true; $('pop').hidden = true; if (!$('iaw').hidden) $('iaw').hidden = true; $('chat').hidden = true; } });

// ---------- cerebro (IA): escolha do modelo conforme o PC, download com progresso ----------
let iaInfoCache = null, iaProg = null;
const gb = mb => mb >= 1000 ? (mb / 1024).toFixed(1) + ' GB' : mb + ' MB';
async function carregaIA() { if (!window.app) return null; iaInfoCache = await app.iaInfo(); iaAtiva = !!iaInfoCache.ativo; return iaInfoCache; }
async function abreIA() { if (!window.app) return; await carregaIA(); renderIA(iaInfoCache.ativo || iaInfoCache.recomendado); $('menu').hidden = true; $('iaw').hidden = false; }
function renderIA(sel, msg = '') {
  const info = iaInfoCache, w = $('iaw'), nomes = { leve: ['mLeve', 'mLeveD'], recomendado: ['mRec', 'mRecD'], profundo: ['mProf', 'mProfD'] }, m = info.modelos.find(x => x.id === sel);
  w.dataset.sel = sel;
  w.innerHTML = `<div class="mh"><b>${T('iaTitulo')}</b><button data-a="fechar">${T('iaFechar')}</button></div>` +
    `<p>${T('iaTexto')}</p><p class="av">${T('iaAviso')}</p><p class="hw">${T('iaPc')}: ${info.ram} GB RAM · ${info.cpus} ${T('nucleos')}${info.gpu ? ' · ' + esc(info.gpu) : ''}</p>` +
    info.modelos.map(x => `<button class="card${x.id === sel ? ' on' : ''}" data-m="${x.id}"><b>${T(nomes[x.id][0])}</b> <i>${gb(x.mb)}</i>` +
      `${x.id === info.recomendado ? ` <em>${T('iaRecomendado')}</em>` : ''}${x.instalado ? ` <em>${T('iaInstalado')}</em>` : ''}${info.ativo === x.id ? ` <em>${T('iaEmUso')}</em>` : ''}` +
      `<br><span>${T(nomes[x.id][1])}${x.aguenta ? '' : ' ⚠ ' + T('iaPesado')}</span></button>`).join('') +
    (iaProg ? `<div class="bar"><i style="width:${iaProg.pct}%"></i></div><p>${T('iaBaixando')}: ${iaProg.pct}% · ${iaProg.mb} MB <button data-a="cancelar">${T('iaCancelar')}</button></p>`
      : `<div class="mf"><button data-a="usar">${m.instalado ? T('iaUsar') : T('iaBaixar') + ' (' + gb(m.mb) + ')'}</button>${m.instalado ? `<button data-a="apagar">${T('iaApagar')}</button>` : ''}<button data-a="nao">${T('iaNao')}</button></div>`) +
    (msg ? `<p class="av">${esc(msg)}</p>` : '');
}
$('iaw').onclick = async e => {
  const w = $('iaw'), sel = w.dataset.sel, c = e.target.closest('[data-m]');
  if (c) return renderIA(c.dataset.m);
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'fechar') w.hidden = true;
  else if (a === 'cancelar') app.iaCancelar();
  else if (a === 'nao') { await app.iaUsar(null); await carregaIA(); w.hidden = true; osd(T('iaSemIa')); }
  else if (a === 'apagar') { iaInfoCache = await app.iaRemover(sel); iaAtiva = !!iaInfoCache.ativo; renderIA(sel); }
  else if (a === 'usar') {
    const m = iaInfoCache.modelos.find(x => x.id === sel);
    if (!m.instalado) {
      iaProg = { pct: 0, mb: 0 }; renderIA(sel);
      const r = await app.iaBaixar(sel); iaProg = null; await carregaIA();
      if (r.erro) return renderIA(sel, `${T('iaErro')}: ${r.erro}. ${T('iaTentar')}.`);
    }
    await app.iaUsar(sel); await carregaIA(); w.hidden = true;
    if (iaAtiva && !s.vida.perfil.ia) enriquecePerfil(s.vida);
  }
};
if (window.app) {
  app.estado().then(e => Object.assign(janelaEstado, e));
  app.aoProgresso(d => { iaProg = d; if (!$('iaw').hidden && iaInfoCache) renderIA($('iaw').dataset.sel); });
  aplicaTamanho();
  carregaIA().then(i => { if (!i) return; if (iaAtiva && !s.vida.perfil.ia) enriquecePerfil(s.vida); if (!i.perguntado) setTimeout(abreIA, 1500); });
}
aplicar();
</script>
</html>
